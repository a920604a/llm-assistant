<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>今日論文摘要</title>
    <style>
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .paper-summary {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            background-color: #fff;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
        }

        .paper-summary:hover {
            transform: translateY(-3px);
        }

        .paper-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 8px;
            color: #1a1a1a;
        }

        .paper-meta {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 12px;
        }

        .paper-meta a {
            color: #1a73e8;
            text-decoration: none;
        }

        .paper-meta a:hover {
            text-decoration: underline;
        }

        .paper-summary:nth-child(even) {
            background-color: #f9f9f9;
        }

        .paper-summary p {
            margin: 8px 0;
        }

        .paper-summary ul,
        .paper-summary ol {
            margin: 8px 0 8px 20px;
        }

        .paper-summary strong {
            color: #000;
        }
    </style>
</head>

<body>
    <h2>今日論文摘要</h2>

    <!-- Papers Section Start -->
    ${papers_html}
    <!-- Papers Section End -->

    <p><em>本摘要僅供參考，最終請依原始論文與專業判斷。</em></p>
</body>

</html>
