networks:
  monitor-net:
    external: true
  langfuse-otel-net:
    external: true
  app-net:
    external: true

services:
  prometheus:
    image: prom/prometheus
    user: "1001"
    volumes:
      - ./monitor/prometheus:/etc/config
      - ./monitor_data/prometheus_data:/prometheus
      - ./monitor/rules:/etc/prometheus/rules
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - "--config.file=/etc/config/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    networks:
      - monitor-net
      - langfuse-otel-net
      - app-net

  alertmanager:
    build:
      context: .
      dockerfile: ./services/alertmanager/Dockerfile.alertmanager
    image: alertmanager:latest
    container_name: alertmanager
    restart: always
    networks:
      - monitor-net
    ports:
      - 127.0.0.1:9093:9093
    env_file:
      - .env

  grafana:
    image: grafana/grafana:latest
    user: "472"
    ports:
      - "0.0.0.0:3002:3000"
    volumes:
      - ./monitor/dashboards:/var/lib/grafana/dashboards # dashboard JSON, Node Exporter Full: 1860 , cAdvisor Exporter: 14282 , Prometheus Blackbox Exporter: 7587
      - ./monitor/provisioning:/etc/grafana/provisioning # provisioning 設定
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_SECRET_KEY: ${GRAFANA_SECRET_KEY:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    restart: always
    networks:
      - monitor-net

  node-exporter:
    image: prom/node-exporter:v1.8.2
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - monitor-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitor-net

  blackbox-exporter:
    image: prom/blackbox-exporter
    container_name: blackbox-exporter
    ports:
      - "9115:9115"
    volumes:
      - ./monitor/blackbox:/config
    command:
      - "--config.file=/config/blackbox.yml"
    networks:
      - monitor-net
      - langfuse-otel-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.41.0
    container_name: redis_exporter
    ports:
      - "9121:9121"
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - langfuse-otel-net
