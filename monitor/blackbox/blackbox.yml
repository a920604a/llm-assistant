modules:
  # ----------------------------
  # 健康檢查 Probe (GET /health)
  # ----------------------------
  http_2xx_health:
    prober: http
    timeout: 5s
    http:
      method: GET
      valid_status_codes: []   # 空表示任何 2xx 都算成功
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"


  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: "ip4"
