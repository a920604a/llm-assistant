apiVersion: 1
datasources:
  - name: postgresql
    type: postgres
    access: proxy
    url: note-db:5432
    isDefault: false
    editable: true
    jsonData:
      defaultDatabase: note
      sslmode: disable
      tlsAuth: false
      tlsAuthWithCACert: false
    secureJsonData:
      user: user                      # POSTGRES_USER
      password: password              # POSTGRES_PASSWORD
