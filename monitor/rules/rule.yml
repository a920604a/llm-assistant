groups:
  - name: Service
    rules:
      # 服務不可用
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          team: app
          service: '{{ $labels.service }}'
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 2 minutes."

      # blackbox GET probe
      - alert: BlackboxHTTPGetFail
        expr: probe_success{job="blackbox-http-get"} == 0
        for: 1m
        labels:
          severity: warning
          team: app
          service: '{{ $labels.service }}'
        annotations:
          summary: "HTTP GET Probe Failed on {{ $labels.instance }}"
          description: "HTTP GET endpoint {{ $labels.instance }} did not respond correctly."

      # blackbox TCP probe
      - alert: BlackboxTCPFail
        expr: probe_success{job="blackbox-tcp"} == 0
        for: 1m
        labels:
          severity: critical
          team: app
          service: '{{ $labels.service }}'
        annotations:
          summary: "TCP Probe Failed on {{ $labels.instance }}"
          description: "TCP endpoint {{ $labels.instance }} is unreachable."


  - name: API
    rules:
      # API 高頻率告警
      - alert: APIHighFrequency
        expr: rate({__name__=~"get_dashboard_stats_total|ask_question_total|post_settings_total|get_user_settings_total"}[1m]) > 0.2
        for: 1m
        labels:
          severity: warning
          team: app
          service: apiGateway
          api: '{{ $labels.__name__ }}'
        annotations:
          summary: "API {{ $labels.api }} is called frequently"
          description: "API {{ $labels.api }} exceeded 12 calls per minute. Current rate: {{ $value }} calls/min"


  - name: System
    rules:
      # 網路不可達
      - alert: NetworkDown
        expr: probe_success{job="blackbox-http-health"} == 0
        for: 2m
        labels:
          severity: critical
          team: ops
          service: network
        annotations:
          summary: "Network unreachable on {{ $labels.instance }}"
          description: "Endpoint {{ $labels.instance }} network down for 2 minutes."

      # 磁碟空間
      - alert: FreeDiskUsage
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/"} * 100 / node_filesystem_size_bytes{mountpoint="/"}) < 20
          or
          (node_filesystem_avail_bytes{mountpoint="/var"} * 100 / node_filesystem_size_bytes{mountpoint="/var"}) < 20
        for: 5m
        labels:
          severity: warning
          team: ops
          service: storage
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Available disk space on {{ $labels.instance }} is below 20%."

      # 記憶體使用率
      - alert: MemoryUsage
        expr: ((1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100) > 75
        for: 2m
        labels:
          severity: warning
          team: ops
          service: system
        annotations:
          summary: "High Memory Usage"
          description: "{{ $labels.instance }} memory usage is above 75%."

      # CPU 使用率
      - alert: HighCPUUsage
        expr: (1 - sum by (instance) (irate(node_cpu_seconds_total{job="node_exporter_metrics",mode="idle"}[5m]))) * 100 > 80
        for: 2m
        labels:
          severity: warning
          team: ops
          service: system
        annotations:
          summary: "High CPU Usage Detected"
          description: "The CPU usage for instance {{ $labels.instance }} exceeded 80% over the last 5 minutes."
